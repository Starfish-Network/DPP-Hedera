[project]
name = "dpp-hedera-api"
version = "0.0.0"
description = "DPP-Hedera integration API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hiero-sdk-python==0.1.10",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "requests==2.32.3",
    "python-dotenv==1.2.1",
    "pydantic-settings==2.3.4",
    "cryptography",
    "google-cloud-kms",
    "boto3==1.28.34",
    "PyJWT",
    "httpx==0.27.0",
    "tenacity==8.5.0",
    "pyld==3.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "respx==0.21.1",
]

[tool.uv]
# The app runs via `uvicorn app.main:app` with pythonpath set (see pytest.ini),
# not as an installed package, so there's no build backend — manage deps only.
package = false
# Install the dev group by default. The Docker image keeps it (the compose
# `integration-tests` service runs pytest inside the built image), matching the
# pre-uv behavior where requirements.txt shipped pytest in the image.
default-groups = ["dev"]
